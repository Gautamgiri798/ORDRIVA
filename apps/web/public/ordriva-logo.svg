<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" fill="none">
  <defs>
    <!-- Brilliant Metallic Gold Gradient for Emblem -->
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="55%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Warm Highlight Gradient -->
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Wordmark White-Gold Gradient -->
    <linearGradient id="textGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FEF9C3" />
      <stop offset="70%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- CLOCHE EMBLEM WITH "O" & MOMENTUM ARROW -->
  <g transform="translate(10, 10)" filter="url(#logoGlow)">
    <!-- Top Handle Knob -->
    <circle cx="48" cy="14" r="5" fill="url(#goldShine)" stroke="#FEF08A" stroke-width="1" />
    <path d="M 45 18 L 51 18 L 49.5 22 L 46.5 22 Z" fill="url(#goldShine)" />

    <!-- Cloche Outer Arched Dome -->
    <path
      d="M 16 64 C 16 38, 30 22, 48 22 C 66 22, 80 38, 80 64 Z"
      fill="none"
      stroke="url(#goldShine)"
      stroke-width="4.5"
      stroke-linecap="round"
    />

    <!-- Cloche Inner Arch Layer -->
    <path
      d="M 23 63 C 23 43, 34 30, 48 30 C 62 30, 73 43, 73 63 Z"
      fill="none"
      stroke="url(#goldHighlight)"
      stroke-width="1.8"
      opacity="0.85"
    />

    <!-- Signature "O" Monogram -->
    <ellipse
      cx="45"
      cy="52"
      rx="14"
      ry="17"
      fill="none"
      stroke="url(#goldShine)"
      stroke-width="4"
      transform="rotate(-12 45 52)"
    />

    <!-- Upward Growth / Momentum Arrow cutting through "O" -->
    <path
      d="M 33 60 Q 48 55, 68 32"
      fill="none"
      stroke="url(#goldHighlight)"
      stroke-width="3.5"
      stroke-linecap="round"
    />
    <!-- Arrowhead -->
    <path
      d="M 68 32 L 58 33 L 64 39 Z"
      fill="url(#goldHighlight)"
      stroke="url(#goldShine)"
      stroke-width="1"
    />

    <!-- Serving Platter Double Rim -->
    <rect x="10" y="65" width="76" height="5" rx="2.5" fill="url(#goldShine)" />
    <rect x="14" y="72" width="68" height="4" rx="2" fill="url(#goldShine)" opacity="0.9" />
  </g>

  <!-- BRAND TYPOGRAPHY: ORDRIVA -->
  <g transform="translate(108, 16)" filter="url(#logoGlow)">
    <!-- Brand Name -->
    <text
      x="0"
      y="42"
      font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif"
      font-weight="900"
      font-size="44"
      letter-spacing="5"
      fill="url(#textGold)"
    >
      ORDRIVA
    </text>

    <!-- Subtitle: RESTAURANT MANAGEMENT -->
    <text
      x="2"
      y="62"
      font-family="'Inter', -apple-system, system-ui, sans-serif"
      font-weight="800"
      font-size="9.5"
      letter-spacing="5"
      fill="#60A5FA"
      opacity="0.9"
    >
      RESTAURANT MANAGEMENT
    </text>


  </g>
</svg>
