<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Brilliant Metallic Gold Gradient for Emblem -->
    <linearGradient id="markGoldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="55%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Warm Highlight Gradient -->
    <linearGradient id="markGoldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <filter id="markDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <g filter="url(#markDropShadow)">
    <!-- Top Handle Knob -->
    <circle cx="50" cy="18" r="5" fill="url(#markGoldShine)" stroke="#FEF08A" stroke-width="1" />
    <path d="M 47 22 L 53 22 L 51.5 26 L 48.5 26 Z" fill="url(#markGoldShine)" />

    <!-- Cloche Outer Arched Dome -->
    <path
      d="M 18 68 C 18 42, 32 26, 50 26 C 68 26, 82 42, 82 68 Z"
      fill="none"
      stroke="url(#markGoldShine)"
      stroke-width="5"
      stroke-linecap="round"
    />

    <!-- Cloche Inner Arch Layer -->
    <path
      d="M 25 67 C 25 47, 36 34, 50 34 C 64 34, 75 47, 75 67 Z"
      fill="none"
      stroke="url(#markGoldHighlight)"
      stroke-width="2"
      opacity="0.85"
    />

    <!-- Signature "O" Monogram -->
    <ellipse
      cx="47"
      cy="56"
      rx="14"
      ry="17"
      fill="none"
      stroke="url(#markGoldShine)"
      stroke-width="4.5"
      transform="rotate(-12 47 56)"
    />

    <!-- Upward Growth / Momentum Arrow cutting through "O" -->
    <path
      d="M 35 64 Q 50 59, 70 36"
      fill="none"
      stroke="url(#markGoldHighlight)"
      stroke-width="4"
      stroke-linecap="round"
    />
    <!-- Arrowhead -->
    <path
      d="M 70 36 L 60 37 L 66 43 Z"
      fill="url(#markGoldHighlight)"
      stroke="url(#markGoldShine)"
      stroke-width="1"
    />

    <!-- Serving Platter Double Rim -->
    <rect x="12" y="69" width="76" height="5.5" rx="2.75" fill="url(#markGoldShine)" />
    <rect x="16" y="77" width="68" height="4" rx="2" fill="url(#markGoldShine)" opacity="0.9" />
  </g>
</svg>
