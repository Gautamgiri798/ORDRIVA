<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="50%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="markGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="markDome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="#172554" stroke="url(#markGrad)" stroke-width="3.5" />
  
  <!-- Glowing Cloche Dome -->
  <path d="M 30 74 C 30 48, 50 36, 60 36 C 70 36, 90 48, 90 74 Z" fill="url(#markDome)" />
  
  <!-- Knob -->
  <circle cx="60" cy="31" r="6" fill="url(#markGold)" />
  <rect x="58.5" y="34" width="3" height="4" fill="url(#markGold)" />

  <!-- Rim -->
  <rect x="25" y="74" width="70" height="6" rx="3" fill="url(#markGold)" />
  
  <!-- Platter -->
  <path d="M 20 85 L 100 85 C 95 92, 80 94, 60 94 C 40 94, 25 92, 20 85 Z" fill="url(#markDome)" />

  <!-- Steam -->
  <path d="M 47 24 C 45 19, 49 14, 47 10" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85" />
  <path d="M 60 21 C 58 16, 62 12, 60 8" stroke="#FDE047" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 73 24 C 71 19, 75 14, 73 10" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85" />
</svg>

